version: 2
updates:
  # requirements.txt is a full freeze (~110 pinned, mostly transitive packages
  # that pin each other), so per-package version bumps usually cannot install.
  # A limit of 0 turns off version-update PRs; Dependabot security updates
  # (alerts) are unaffected. Refresh dependencies by hand and test first.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 0

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
