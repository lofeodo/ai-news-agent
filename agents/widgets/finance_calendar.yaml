# Central bank decisions and major US data releases, for the finance widgets (rates_board, week_ahead).
# Every date is copied from the official page linked under its event; checked 2026-10-16.
# YEARLY UPDATE (owner, each summer when the banks publish next year's schedule): add the next year's dates and
# move `valid_until` forward. Once a send date passes valid_until the widgets fail with "finance calendar ends
# ..." in the health check rather than showing a calendar that silently runs out. docs/widgets.md explains.
valid_until: '2027-12-16'
events:
  boc:
    name: Bank of Canada rate decision
    short: BoC decision
    time_et: '9:45 AM'
    source: https://www.bankofcanada.ca/2026/07/bank-canada-publishes-2027-schedule-policy-interest-rate-announcements-other-major-publications/
    dates: ['2026-10-28', '2026-12-09',
            '2027-01-27', '2027-03-03', '2027-04-28', '2027-06-02', '2027-07-21', '2027-09-08', '2027-10-27', '2027-12-08']
  fomc:
    name: Federal Reserve (FOMC) rate decision
    short: Fed decision
    # The decision is announced on the second day of each two-day meeting; 2027 dates are tentative until
    # confirmed at the meeting before.
    source: https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm
    dates: ['2026-10-28', '2026-12-09',
            '2027-01-27', '2027-03-17', '2027-04-28', '2027-06-09', '2027-07-28', '2027-09-15', '2027-10-27', '2027-12-08']
  ecb:
    name: European Central Bank rate decision
    short: ECB decision
    source: https://www.ecb.europa.eu/press/calendars/mgcgc/html/index.en.html
    dates: ['2026-10-29', '2026-12-17',
            '2027-02-04', '2027-03-18', '2027-04-29', '2027-06-10', '2027-07-22', '2027-09-09', '2027-10-28', '2027-12-16']
  us_cpi:
    name: US consumer prices (CPI)
    short: US CPI
    time_et: '8:30 AM'
    source: https://www.bls.gov/schedule/news_release/cpi.htm
    dates: ['2026-11-10', '2026-12-10',
            '2027-01-13', '2027-02-11', '2027-03-10', '2027-04-13', '2027-05-12', '2027-06-10', '2027-07-14',
            '2027-08-11', '2027-09-14', '2027-10-14', '2027-11-10', '2027-12-10']
  us_jobs:
    name: US jobs report
    short: US jobs
    time_et: '8:30 AM'
    source: https://www.bls.gov/schedule/news_release/empsit.htm
    dates: ['2026-11-06', '2026-12-04',
            '2027-01-08', '2027-02-05', '2027-03-05', '2027-04-02', '2027-05-07', '2027-06-04', '2027-07-02',
            '2027-08-06', '2027-09-03', '2027-10-08', '2027-11-05', '2027-12-03']
