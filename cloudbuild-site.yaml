# Re-bakes the landing page's issue excerpt and deploys Firebase Hosting. Nothing here touches the
# Cloud Run services. Run on a schedule (see docs/runbook.md, "Landing page excerpt") or by hand:
#   gcloud builds submit --config cloudbuild-site.yaml .
#
# If the bake step fails the build stops before the deploy, so the live site keeps the previous
# issue's excerpt. Pinned firebase-tools; bump deliberately.
steps:
- id: bake-excerpt
  name: 'python:3.12-slim'
  entrypoint: python
  args: ['tools/bake_landing_excerpt.py']

- id: deploy-hosting
  name: 'node:20'
  entrypoint: npx
  args: ['--yes', 'firebase-tools@13.29.1', 'deploy', '--only', 'hosting',
         '--project', 'ai-news-letter-497720', '--non-interactive']

timeout: 900s
options:
  logging: CLOUD_LOGGING_ONLY
