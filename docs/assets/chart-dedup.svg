<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" role="img" aria-label="Duplicate removal. Duplicate recall, Control 0%; Duplicate recall, Haiku 90%; Duplicate recall, Sonnet 93%; Duplicates left in the section, Control 100%; Duplicates left in the section, Haiku 7%; Duplicates left in the section, Sonnet 9%">
