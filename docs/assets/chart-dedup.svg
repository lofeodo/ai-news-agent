<rect x="0.5" y="0.5" width="879" height="339" rx="14" fill="#161616" stroke="#2a2a2a"/>
<text x="28" y="40" font-size="20" font-weight="600" class="s">Duplicate removal by arm</text>
<text x="28" y="62" font-size="13" class="m">Control removes nothing. Hand-labeled article sets, Wilson 95% intervals</text>
