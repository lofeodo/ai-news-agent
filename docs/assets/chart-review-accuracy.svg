<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" role="img" aria-label="Review loop accuracy. n=90. Single-pass 62% (52% to 72%); Graph, first pass 59% (49% to 68%); Graph, after review 60% (50% to 70%)">
<title>Review loop accuracy</title><desc>n=90. Single-pass 62% (52% to 72%); Graph, first pass 59% (49% to 68%); Graph, after review 60% (50% to 70%)</desc>
<style>text{font-family:system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#e8e8e8} .m{fill:#8b8b8b} .s{fill:#c8b89a}</style>
<rect x="0.5" y="0.5" width="879" height="339" rx="14" fill="#161616" stroke="#2a2a2a"/>
<text x="28" y="40" font-size="20" font-weight="600" class="s">Does the review loop help?</text>
<text x="28" y="62" font-size="13" class="m">Category accuracy on 90 hand-labeled articles, with Wilson 95% intervals</text>
<line x1="90" x2="840" y1="270.0" y2="270.0" stroke="#2a2a2a"/><text x="80" y="274.0" font-size="12" text-anchor="end" class="m">0%</text>
<line x1="90" x2="840" y1="223.5" y2="223.5" stroke="#2a2a2a"/><text x="80" y="227.5" font-size="12" text-anchor="end" class="m">25%</text>
<line x1="90" x2="840" y1="177.0" y2="177.0" stroke="#2a2a2a"/><text x="80" y="181.0" font-size="12" text-anchor="end" class="m">50%</text>
<line x1="90" x2="840" y1="130.5" y2="130.5" stroke="#2a2a2a"/><text x="80" y="134.5" font-size="12" text-anchor="end" class="m">75%</text>
<line x1="90" x2="840" y1="84.0" y2="84.0" stroke="#2a2a2a"/><text x="80" y="88.0" font-size="12" text-anchor="end" class="m">100%</text>
<rect x="160.0" y="154.3" width="110" height="115.7" rx="6" fill="#6b7280"/>
<text x="215.0" y="220.1" font-size="22" font-weight="700" text-anchor="middle">62%</text>
<g stroke="#e8e8e8" stroke-width="2"><line x1="215.0" x2="215.0" y1="173.5" y2="136.9"/><line x1="206.0" x2="224.0" y1="173.5" y2="173.5"/><line x1="206.0" x2="224.0" y1="136.9" y2="136.9"/></g>
<text x="215.0" y="292" font-size="14" text-anchor="middle">Single-pass</text>
<rect x="410.0" y="160.5" width="110" height="109.5" rx="6" fill="#4f46e5"/>
<text x="465.0" y="223.2" font-size="22" font-weight="700" text-anchor="middle">59%</text>
<g stroke="#e8e8e8" stroke-width="2"><line x1="465.0" x2="465.0" y1="179.7" y2="142.6"/><line x1="456.0" x2="474.0" y1="179.7" y2="179.7"/><line x1="456.0" x2="474.0" y1="142.6" y2="142.6"/></g>
<text x="465.0" y="292" font-size="14" text-anchor="middle">Graph, first pass</text>
<rect x="660.0" y="158.4" width="110" height="111.6" rx="6" fill="#7c3aed"/>
<text x="715.0" y="222.2" font-size="22" font-weight="700" text-anchor="middle">60%</text>
<g stroke="#e8e8e8" stroke-width="2"><line x1="715.0" x2="715.0" y1="177.6" y2="140.7"/><line x1="706.0" x2="724.0" y1="177.6" y2="177.6"/><line x1="706.0" x2="724.0" y1="140.7" y2="140.7"/></g>
<text x="715.0" y="292" font-size="14" text-anchor="middle">Graph, after review</text>
<text x="852" y="40" font-size="13" text-anchor="end" class="m">All three intervals overlap: no measurable difference</text>
</svg>
