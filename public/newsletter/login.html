<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Latent SpaceMail — Sign in</title>
  <link rel="icon" type="image/svg+xml" href="/images/logo-mark.svg">
  <link rel="icon" type="image/png" href="/images/logo-email.png">
  <link rel="preload" href="/fonts/cormorant-garamond-600.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="topbar.css">
</head>
<body>
  <canvas id="bg-canvas" style="position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;will-change:transform;"></canvas>

  <header class="topbar">
    <a href="/" class="topbar__logo" aria-label="Latent SpaceMail home">
      <img src="/images/logo-mark.svg" alt="" height="26" width="26" fetchpriority="high">
    </a>
    <nav class="topbar__nav" aria-label="Main">
      <a href="/preview.html" class="topbar__nav-link" data-href="/preview.html">Latest Issue<span class="topbar__live"><span class="topbar__live-dot"></span>Live</span></a>
      <a href="/sections.html" class="topbar__nav-link" data-href="/sections.html" id="topbar-sections">Customize</a>
      <a href="/preferences.html" class="topbar__nav-link" data-href="/preferences.html">Preferences</a>
    </nav>
    <div class="topbar__right">
      <div class="topbar__auth" id="topbar-auth" style="display:none">
        <span class="topbar__auth-dot"></span>
        <span class="topbar__auth-email" id="topbar-email"></span>
        <span class="topbar__auth-tier" id="topbar-tier" style="display:none">◆ Premium</span>
        <button type="button" class="topbar__signout" id="topbar-signout">Sign out</button>
      </div>
      <a href="/login.html" class="topbar__signin" id="topbar-signin">Sign in →</a>
      <span class="share-wrap">
        <button type="button" class="share-btn" id="share-btn" aria-label="Share Latent SpaceMail">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7M16 6l-4-4-4 4M12 2v14"/></svg>
          Share
        </button>
      </span>
      <a href="https://github.com/lofeodo/ai-news-agent" target="_blank" rel="noopener" class="topbar__github" aria-label="View source on GitHub">
        <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" fill="currentColor"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>
        <span class="topbar__github-label">GitHub</span>
      </a>
    </div>
  </header>

  <div class="card">
    <h1><span class="prompt">❯</span> Sign in</h1>
    <p class="subtitle">Sign in with Google to manage your newsletter and customize your sections.</p>

    <!-- Auth error -->
    <div class="msg error" id="auth-error" style="display:none;margin-bottom:18px;"></div>

    <!-- Plain <a> to a backend redirect — no click handler needed, so there's
         no client-side error path for *starting* sign-in (see auth.js /
         auth-callback.html for the server-side OAuth Authorization Code flow). -->
    <a id="google-btn" class="btn-google" href="#">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Continue with Google
    </a>

    <div class="auth-divider"><span>or</span></div>

    <!-- No account needed: the emailed link carries the subscriber's token. -->
    <form id="request-form" novalidate>
      <div class="field">
        <label for="req-email">Get a preferences link by email</label>
        <input type="email" id="req-email" name="email" autocomplete="email" required placeholder="you@example.com">
      </div>
      <button type="submit" id="req-btn">Email me a link</button>
      <div class="msg" id="req-msg"></div>
    </form>

    <a href="/" class="btn-email-link">Not subscribed yet? Subscribe with your email →</a>
  </div>

  <script src="bg.js"></script>
  <script src="share.js"></script>
  <script>LSMShare.attachButton(document.getElementById('share-btn'));</script>
  <script type="module" src="nav.js"></script>
  <script type="module">
    // auth.js already initializes Firebase — import auth from there to avoid duplicate-app error.
    import { auth, onAuthStateChanged, sanitizeReturnPage } from './auth.js';

    const API_BASE = (() => {
      const h = location.hostname;
      if (h === 'localhost' || h === '127.0.0.1') return 'http://localhost:8000';
      return 'https://agent-subscriptions-zozrn33sna-nn.a.run.app';
    })();

    const returnUrl = sanitizeReturnPage(new URLSearchParams(location.search).get('returnUrl'));

    // If already signed in, redirect immediately.
    onAuthStateChanged(auth, (user) => {
      if (user && user.emailVerified) {
        location.href = returnUrl;
      }
    });

    // Google sign-in is a plain navigation to the backend, not an SDK call —
    // see auth.js / auth-callback.html for why.
    document.getElementById('google-btn').href =
      `${API_BASE}/auth/google/login?return_to=${encodeURIComponent(returnUrl)}`;

    const authError = document.getElementById('auth-error');
    function showError(msg) {
      authError.textContent   = msg;
      authError.style.display = 'block';
    }
    const authErrorParam = new URLSearchParams(location.search).get('auth_error');
    if (authErrorParam === 'google_signin_failed') {
      showError('Something went wrong signing in with Google. Please try again.');
    } else if (authErrorParam === 'google_signin_unavailable') {
      showError("Google sign-in isn't available right now. Use the email link below instead.");
    }

    // ── Emailed preferences link (POST /request-preferences) ────────────────
    const reqForm = document.getElementById('request-form');
    const reqBtn  = document.getElementById('req-btn');
    const reqMsg  = document.getElementById('req-msg');
    function showReqMsg(text, type) {
      reqMsg.textContent = text;
      reqMsg.className = `msg visible ${type}`;
    }
    reqForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('req-email').value.trim();
      if (!email) { showReqMsg('Please enter your email address.', 'error'); return; }
      reqBtn.disabled = true;
      reqBtn.textContent = 'Sending…';
      try {
        const res = await fetch(`${API_BASE}/request-preferences`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email }),
        });
        if (res.status === 429) {
          showReqMsg('Too many attempts. Please wait a minute and try again.', 'error');
        } else {
          reqForm.reset();
          showReqMsg("If that address is subscribed, a link is on its way. Check your inbox (and spam folder).", 'success');
        }
      } catch {
        showReqMsg('Something went wrong. Please try again.', 'error');
      }
      reqBtn.disabled = false;
      reqBtn.textContent = 'Email me a link';
    });
  </script>
</body>
</html>
